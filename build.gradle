plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '3.5.3'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.github.node-gradle.node' version '7.1.0'
}

group = 'WinRisk'
version = '1.0-SNAPSHOT'

sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'com.google.code.gson:gson'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'junit:junit:4.13.2'
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine'
}

jacoco {
    toolVersion = "0.8.11"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.7
            }
        }
    }
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport, jacocoTestCoverageVerification
}

springBoot {
    mainClass = 'com.winrisk.web.WinRiskApplication'
}

// --- Frontend build (React SPA under frontend/) ---
// Attached to bootJar only, so `./gradlew test` and the coverage gate never
// need Node. Skip entirely with -PskipFrontend.
node {
    download = false
    nodeProjectDir = file('frontend')
}

tasks.named('npmInstall') {
    npmCommand = ['ci']
}

tasks.register('npmBuild', com.github.gradle.node.npm.task.NpmTask) {
    dependsOn 'npmInstall'
    args = ['run', 'build']
    inputs.dir('frontend/src')
    inputs.files('frontend/package.json', 'frontend/package-lock.json',
            'frontend/vite.config.ts', 'frontend/index.html', 'frontend/tsconfig.json')
    outputs.dir('frontend/dist')
}

bootJar {
    if (!project.hasProperty('skipFrontend')) {
        dependsOn 'npmBuild'
        from('frontend/dist') {
            into 'BOOT-INF/classes/static'
        }
    }
}
