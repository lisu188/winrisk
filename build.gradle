plugins {
    id 'com.android.application' version '8.13.2' apply false
}

ext {
    gdxVersion = '1.14.2'
    gsonVersion = '2.13.1'
}

tasks.register('test') {
    dependsOn ':core:test'
}

tasks.register('build') {
    dependsOn ':core:test', ':lwjgl3:classes', ':android:assembleDebug'
}

tasks.register('clean') {
    dependsOn ':core:clean', ':lwjgl3:clean', ':android:clean'
}

tasks.register('run') {
    dependsOn ':lwjgl3:run'
}
