name: C++ Engine v6

on:
  push:
    branches:
      - qt-cpp
      - main
    paths:
      - 'src/engine/**'
      - 'tests/engine_tests_v6.cpp'
      - 'tests/ai_strategy_tests.cpp'
      - 'tests/builtin_map_tests.cpp'
      - 'tests/procedural_map_tests.cpp'
      - '.github/workflows/engine-v6.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/engine/**'
      - 'tests/engine_tests_v6.cpp'
      - 'tests/ai_strategy_tests.cpp'
      - 'tests/builtin_map_tests.cpp'
      - 'tests/procedural_map_tests.cpp'
      - '.github/workflows/engine-v6.yml'
  workflow_dispatch:

jobs:
  engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build and run strict C++20 engine suites
        shell: bash
        run: |
          set -euo pipefail
          sources=(
            src/engine/GameEngineCore.cpp
            src/engine/WorldMap.cpp
            src/engine/BuiltinMaps.cpp
            src/engine/ProceduralMap.cpp
            src/engine/MissionRules.cpp
            src/engine/CapitalRules.cpp
            src/engine/TwoPlayerRules.cpp
            src/engine/CombatRules.cpp
            src/engine/AiIdentity.cpp
            src/engine/AiStrategies.cpp
          )
          tests=(
            engine_tests_v6
            ai_strategy_tests
            builtin_map_tests
            procedural_map_tests
          )
          for test in "${tests[@]}"; do
            g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror -Isrc \
              "${sources[@]}" "tests/${test}.cpp" -o "$test"
            "./$test"
          done
