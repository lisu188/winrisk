name: libGDX

on:
  pull_request:
    paths:
      - 'build.gradle'
      - 'settings.gradle'
      - 'core/**'
      - 'lwjgl3/**'
      - 'android/**'
      - 'src/main/java/com/winrisk/game/**'
      - 'src/main/resources/**'
      - 'src/test/java/com/winrisk/game/**'
      - '.github/workflows/libgdx.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Build and test
        run: ./gradlew :core:test :lwjgl3:classes :android:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: winrisk-libgdx-android-debug
          path: android/build/outputs/apk/debug/android-debug.apk
          if-no-files-found: error
