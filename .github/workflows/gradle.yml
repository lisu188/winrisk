name: WinRisk CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Test engine
        id: engine_tests
        continue-on-error: true
        run: ./gradlew :core:test --stacktrace

      - name: Print failing test reports
        if: steps.engine_tests.outcome == 'failure'
        run: find core/build/test-results/test -name '*.xml' -type f -print -exec cat {} \;

      - name: Fail on engine test errors
        if: steps.engine_tests.outcome == 'failure'
        run: exit 1

      - name: Build desktop and Android
        run: ./gradlew :lwjgl3:classes :android:assembleDebug --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: WinRisk-android-debug
          path: android/build/outputs/apk/debug/android-debug.apk
          if-no-files-found: error
