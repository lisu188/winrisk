name: Qt C++

on:
  push:
    branches:
      - qt-cpp
      - main
    paths:
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'src/engine/**'
      - 'src/qt/**'
      - 'src/app/**'
      - 'qml/**'
      - 'tests/**'
      - '.github/workflows/qt.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'src/engine/**'
      - 'src/qt/**'
      - 'src/app/**'
      - 'qml/**'
      - 'tests/**'
      - '.github/workflows/qt.yml'
  workflow_dispatch:

jobs:
  desktop:
    name: Desktop ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          cache: true

      - name: Configure
        run: cmake -S . -B build/qt -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build/qt --config Release --parallel

      - name: Test
        run: ctest --test-dir build/qt -C Release --output-on-failure

  android:
    name: Android arm64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          host: linux
          target: android
          arch: android_arm64_v8a
          cache: true

      - name: Configure Android
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
        run: >-
          qt-cmake -S . -B build/android -GNinja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-28
          -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT"
          -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT"

      - name: Build APK
        run: cmake --build build/android --target apk --parallel

      - name: Collect APK
        run: |
          APK="$(find build/android -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" WinRisk-android-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WinRisk-android-arm64
          path: WinRisk-android-arm64.apk
          if-no-files-found: error
